OUTPUT_DIR: "output_dic/baseline/voc075/"
MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHT: "catalog://ImageNetPretrained/MSRA/R-101"
  DOMAIN_ADAPTATION_ON: True
  BACKBONE:
    CONV_BODY: "R-101-FPN"
    OUT_CHANNELS: 256
  RPN:
    USE_FPN: True
    ANCHOR_STRIDE: (4, 8, 16, 32, 64)
    PRE_NMS_TOP_N_TRAIN: 2000
    PRE_NMS_TOP_N_TEST: 1000
    POST_NMS_TOP_N_TEST: 1000
    FPN_POST_NMS_TOP_N_TEST: 1000
  ROI_HEADS:
    USE_FPN: True
    BATCH_SIZE_PER_IMAGE: 256
  ROI_BOX_HEAD:
    NUM_CLASSES: 18
    POOLER_RESOLUTION: 7
    POOLER_SCALES: (0.25, 0.125, 0.0625, 0.03125)
    POOLER_SAMPLING_RATIO: 2
    FEATURE_EXTRACTOR: "FPN2MLPFeatureExtractor"
    PREDICTOR: "FPNPredictor"
  DA_HEADS:
    DA_IMG_GRL_WEIGHT: 0.1
    DA_INS_GRL_WEIGHT: 0.1
    COS_WEIGHT: 0.1
    AVG_ITER: 0
DATASETS:
  SOURCE_TRAIN: ("openset_voc07_0.75", "openset_voc12_0.75" )
  TARGET_TRAIN: ("open_clipart_0.75", )
  TEST: ("clipart_test_0.75", )
INPUT:
  MIN_SIZE_TRAIN: (600,)
  MAX_SIZE_TRAIN: 1200 
  MIN_SIZE_TEST: 600 
  MAX_SIZE_TEST: 1200
DATALOADER:
  SIZE_DIVISIBILITY: 32
SOLVER:
  BASE_LR: 0.0025
  WEIGHT_DECAY: 0.0001
  STEPS: (50000,)
  MAX_ITER: 70000
  IMS_PER_BATCH: 2
  CHECKPOINT_PERIOD: 500
  MIN_VAL_SETP: 20000
TEST:
  IMS_PER_BATCH: 1
